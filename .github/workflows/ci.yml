name: ci

# Minimal merge gate, provisioned by grahambrooks/auto-managed (ensure_ci.sh).
# Dependency PRs cannot auto-merge without a green check, so every managed repo
# needs at least this. Edit freely — the control plane never overwrites it.

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Don't hand-roll the download: the `releases/latest/download/` path only
      # serves assets of whatever the current tag is, so a version-stamped
      # filename 404s and tar chokes on the HTML error page.
      # Pinned to the 0.4 line: 0.5 rejects keys existing books still carry
      # (`multilingual = false` -> "TOML parse error"), so "latest" fails the
      # gate on an mdbook release rather than on a dependency bump.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4,cargo-binstall
      # Preprocessors are separate binaries; a book that names one cannot build
      # without it.
      - name: Install preprocessors named in book.toml
        run: |
          for p in $(grep -oE 'command *= *"mdbook-[a-z0-9-]+"' book.toml \
                       | grep -oE 'mdbook-[a-z0-9-]+' | sort -u); do
            cargo binstall -y "$p"
          done
      - run: mdbook build
